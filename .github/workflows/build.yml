name: Build, Test, and Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential
    
    - name: Create build directory
      run: mkdir -p build
    
    - name: Configure CMake
      working-directory: build
      run: cmake ..
    
    - name: Build
      working-directory: build
      run: cmake --build . --config Release
    
    - name: Run tests
      working-directory: build
      run: ctest --verbose
    
    - name: Upload artifacts (main branch only)
      if: github.ref == 'refs/heads/main' && success()
      uses: actions/upload-artifact@v3
      with:
        name: simplestring-release-${{ github.run_number }}
        path: |
          build/simplestring_app
          build/test_runner
        retention-days: 90
    
    - name: Create Release (main branch only)
      if: github.ref == 'refs/heads/main' && success() && startsWith(github.ref, 'refs/tags/')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false
